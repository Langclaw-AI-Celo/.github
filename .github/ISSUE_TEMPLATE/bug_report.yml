name: Bug report
description: Report a reproducible problem in a Langclaw AI Celo repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Remove credentials, private keys, wallet signatures, cookies, and personal data before submitting.

  - type: dropdown
    id: repository
    attributes:
      label: Affected repository
      options:
        - frontend
        - backend
        - contracts
        - .github
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Summary
      description: State the problem in one sentence.
      placeholder: Wallet reconnect fails after the cached session expires.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Connect ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, URL, browser, wallet, operating system, and relevant tool versions.
      placeholder: Commit SHA, deployed URL, macOS 15, Chrome 140, MetaMask, Node 22
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, screenshots, public transaction hashes, or a minimal reproduction.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and personal data.
          required: true
        - label: This is not a private vulnerability report.
          required: true
